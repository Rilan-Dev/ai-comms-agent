# Manual local application stack.
# External-infrastructure mode: this compose file MUST NOT create PostgreSQL,
# Redis, RabbitMQ, Qdrant, or migration containers. Those services are managed
# separately and are reached through .env.docker endpoint variables.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Local manual stack keeps dev identity available, but only via the
      # explicit .env opt-in (ACA_ENABLE_DEV_IDENTITY=true, see .env.example)
      # so an unset variable can never silently enable it.
      ACA_ENABLE_DEV_IDENTITY: "${ACA_ENABLE_DEV_IDENTITY:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3300:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
