# Manual local application stack.
# External-infrastructure mode: this compose file MUST NOT create PostgreSQL,
# Redis, RabbitMQ, Qdrant, or migration containers. Those services are managed
# separately and are reached through .env.docker endpoint variables.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      ACA_ENABLE_DEV_IDENTITY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3300:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
