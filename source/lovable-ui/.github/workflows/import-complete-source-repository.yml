name: Import complete source repository

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or tag to import"
        required: true
        default: "main"
      destination_prefix:
        description: "Directory that will contain the complete source repository"
        required: true
        default: "source/ai-comms-agent"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: complete-source-import
  cancel-in-progress: false

jobs:
  import-source-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}

      - name: Configure git subtree
        run: |
          sudo apt-get update
          sudo apt-get install -y git-subtree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source repository history
        env:
          SYNC_TOKEN: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test -n "$SYNC_TOKEN" || { echo "::error::CROSS_REPO_SYNC_TOKEN is not configured"; exit 1; }
          git remote add source "https://x-access-token:${SYNC_TOKEN}@github.com/Rilan-Dev/ai-comms-agent.git"
          git fetch --no-tags source "$SOURCE_REF"

      - name: Import complete repository without overwriting Lovable files
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          DESTINATION_PREFIX: ${{ inputs.destination_prefix }}
        run: |
          if git ls-tree HEAD -- "$DESTINATION_PREFIX" | grep -q .; then
            echo "::error::Destination prefix already exists: $DESTINATION_PREFIX. Refusing to overwrite."
            exit 1
          fi
          git subtree add --prefix="$DESTINATION_PREFIX" "source/$SOURCE_REF"
          git status --short
          git log -1 --oneline

      - name: Push imported repository history to the current PR branch
        env:
          SYNC_TOKEN: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
