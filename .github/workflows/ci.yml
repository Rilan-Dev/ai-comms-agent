name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Full local verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_comms_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_comms_agent_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verification
        run: bash scripts/verify.sh

      - name: Apply Phase 3 PostgreSQL migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_comms_agent_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_identity_rbac.sql

      - name: Verify PostgreSQL migration runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_comms_agent_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-phase3-migration.sql


      - name: Verify ownerless organization rejection
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_comms_agent_test
        run: |
          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-phase3-migration-fail.sql > /tmp/phase3-ownerless.log 2>&1
          status=$?
          set -e
          cat /tmp/phase3-ownerless.log
          if [ "$status" -eq 0 ]; then
            echo "ERROR: ownerless organization unexpectedly committed"
            exit 1
          fi
          grep -q "has no active owner at commit" /tmp/phase3-ownerless.log
          echo "Ownerless organization rejection: PASS"

      - name: Secret scan
        run: |
          set -e
          if grep -rnE 'ghp_[A-Za-z0-9]{36}|vcp_[A-Za-z0-9]{40,}'             --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' --include='*.mjs' --include='*.js'             .             --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=vendor --exclude-dir=.next --exclude-dir=dist; then
            echo "ERROR: Token pattern detected in tracked files"
            exit 1
          fi
          echo "Secret scan: clean"
