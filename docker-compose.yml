# Docker Compose for local development infrastructure
# Per docs/architecture/DEPLOYMENT.md and Phase 2 scope.
#
# Also used for single-VPS all-in-one deployments (web + worker + local-infra
# profile on one host behind a reverse proxy).
#
# SECURITY (2026-10-24): the aca-redis container on the production VPS was
# compromised through the previously unprefixed "6379:6379" port publish.
# Docker port publishes are NOT filtered by firewalld on the host, so an
# unprefixed binding exposes the service on every interface, including the
# public one. All local-infra publishes below are therefore bound to
# 127.0.0.1: application containers reach these services over the compose
# network by DNS name (aca-postgres / aca-redis / aca-rabbitmq / aca-qdrant),
# and host-side access (psql / redis-cli / management UI) still works via
# localhost or an SSH tunnel. No host firewall is required with these
# bindings.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        ACA_RELEASE_REVISION: "${ACA_RELEASE_REVISION:-unrecorded}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACA_RELEASE_REVISION: "${ACA_RELEASE_REVISION:-unrecorded}"
      # Dev identity (x-dev-user-id stub + dev seed) must stay OFF for
      # production deployments. With NODE_ENV=production the auth adapter is
      # the PostgreSQL-backed LocalIdentityAdapter regardless, but leaving
      # this "true" also let ensureDevSeed() write a dev user/org into the
      # production database. Default false; local development sets
      # ACA_ENABLE_DEV_IDENTITY=true in .env (see .env.example).
      ACA_ENABLE_DEV_IDENTITY: "${ACA_ENABLE_DEV_IDENTITY:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3300:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        ACA_RELEASE_REVISION: "${ACA_RELEASE_REVISION:-unrecorded}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACA_RELEASE_REVISION: "${ACA_RELEASE_REVISION:-unrecorded}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    profiles: ["local-infra"]
    image: postgres:16-alpine
    container_name: aca-postgres
    environment:
      POSTGRES_USER: aca
      POSTGRES_PASSWORD: aca_local_dev
      POSTGRES_DB: aca
    ports:
      # Loopback-only: host-side psql/SSH-tunnel access without exposing the
      # production database to the internet. Containers use aca-postgres:5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - aca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aca"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    profiles: ["local-infra"]
    image: redis:7-alpine
    container_name: aca-redis
    ports:
      # Loopback-only. An unprefixed "6379:6379" publish let a Redis-scanning
      # worm reach this container directly from the internet (contained
      # 2026-10-24). Containers use aca-redis:6379 over the compose network.
      - "127.0.0.1:6379:6379"
    volumes:
      - aca-redis-data:/data
    healthcheck:
      # Require the literal PONG reply so a hijacked/non-Redis PID 1 is
      # reported unhealthy even if the CLI process itself exits 0.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    profiles: ["local-infra"]
    image: rabbitmq:3.13-management-alpine
    container_name: aca-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aca
      RABBITMQ_DEFAULT_PASS: aca_local_dev
    ports:
      # Loopback-only: AMQP and the management UI stay reachable from the
      # host (localhost or SSH tunnel) but not from the internet. Containers
      # use aca-rabbitmq:5672 over the compose network.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - aca-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    profiles: ["local-infra"]
    image: qdrant/qdrant:v1.12.4
    container_name: aca-qdrant
    ports:
      # Loopback-only: REST/gRPC stay reachable from the host but not from
      # the internet. Containers use aca-qdrant:6333 over the compose network.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - aca-qdrant-data:/qdrant/storage
    healthcheck:
      # Prefer the HTTP health endpoint; fall back to a raw TCP connect when
      # the image lacks curl, so the check does not fail purely for missing
      # tooling.
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aca-postgres-data:
  aca-redis-data:
  aca-rabbitmq-data:
  aca-qdrant-data:
