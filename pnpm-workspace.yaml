packages:
  - "apps/*"
  - "packages/*"

# Only previously reviewed, version-pinned native build dependencies may run
# installation scripts. Never approve all current/future transitive packages.
strictDepBuilds: true
allowBuilds:
  'esbuild@0.21.5': true
  'esbuild@0.28.2': true
  'sharp@0.35.5': true
  '@tailwindcss/oxide@4.3.3': true
  # UnRS maintainers confirm this legacy-npm postinstall is unnecessary with
  # pnpm's installed optional native binding. Deny script execution explicitly
  # instead of weakening strictDepBuilds or approving all dependency scripts.
  'unrs-resolver@1.12.2': false
