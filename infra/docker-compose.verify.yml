# Disposable PostgreSQL verification environment for manual Phase 3 testing.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aca
      POSTGRES_PASSWORD: aca_local_dev
      POSTGRES_DB: aca_verify
    ports:
      - "55432:5432"
    volumes:
      - aca-postgres-verify:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aca -d aca_verify"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgresql://aca:aca_local_dev@postgres:5432/aca_verify
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - apk add --no-cache bash coreutils >/dev/null && bash /workspace/scripts/migrate.sh && bash /workspace/scripts/migration-changes.sh

volumes:
  aca-postgres-verify:
